name: Build OPMIZER

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: |
          set +e
          gradle build --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          {
            echo '### Build errors'
            echo '```'
            grep -E -B1 -A4 'error:|What went wrong|Could not|FAILED' build.log | head -80
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opmizer-jar
          path: build/libs/*.jar
