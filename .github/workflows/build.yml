name: Build OPMIZER

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      - name: Build
        run: |
          set +e
          gradle build --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            {
              echo '### Build errors'
              echo -e '\x60\x60\x60'
              grep -E -B1 -A4 'error:|What went wrong|Could not|FAILED' build.log | head -80
              echo -e '\x60\x60\x60'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - uses: actions/upload-artifact@v7
        with:
          name: opmizer-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/opmizer-*.jar | grep -v sources | head -n1)
          gh release create "$GITHUB_REF_NAME" "$JAR" \
            --title "OPMIZER $GITHUB_REF_NAME" \
            --notes "Needs Minecraft 26.1.2, Fabric Loader 0.19.3+, Fabric API 0.155.2+26.1.2, Java 25. OPMIZER measures real performance and promises no FPS."
